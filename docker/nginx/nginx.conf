# EcoGrid OS edge gateway.
#
# Responsibilities that must NOT live in the application process:
#   * TLS termination          — the app should never see a private key
#   * serving the dashboard    — static assets, not Python
#   * edge rate limiting       — coarse per-IP protection in front of the API's
#                                per-key limiting (defence in depth)
#
# The API keeps its own per-key limiter because per-IP limiting is useless
# behind a NAT and says nothing about *which* caller is abusing the service.

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_status 429;

# Docker's embedded DNS.
#
# nginx resolves a hostname in a plain `proxy_pass http://host:port` ONCE, at
# startup. Recreating the `api` container gives it a new IP, so the gateway keeps
# proxying to a dead address: every /api and /healthz request returns 502 while
# the static dashboard still serves fine — which reads like an API fault rather
# than a stale DNS entry.
#
# Putting the upstream in a variable defers resolution to request time, and
# `valid=10s` bounds how long an address is cached. (An `upstream` block has the
# same startup-resolution problem and does not re-resolve.)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    listen 8443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Deferred upstream — see the resolver note above. With a variable the
    # request URI is passed through unchanged, so `/healthz` and `/api/v1/...`
    # reach the API exactly as sent.
    set $api http://api:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # React SPA: unknown paths must fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Liveness is proxied but deliberately NOT rate limited — throttling a
    # healthcheck would let an orchestrator mark a healthy service as failed.
    location = /healthz {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API reads X-Forwarded-For for its audit log, honouring one hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
