[pytest]
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Keep temp artefacts inside the project: works in sandboxed/CI environments
# where writes to the system temp directory are restricted.
addopts = --basetemp=.pytest_tmp
markers =
    integration: requires the Dockerized PostgreSQL/Redis stack; auto-skipped when unreachable
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
