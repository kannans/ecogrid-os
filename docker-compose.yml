# EcoGrid OS — Phase 1 infrastructure
# PostgreSQL 15 (system state + audit) · Redis 7 (session cache) · Apache Kafka 3.x (KRaft, event spine)
#
#   docker compose up -d
#   docker compose --profile worker up -d --build     # also run the ingestion worker
#   docker compose logs -f kafka-init                 # confirm topic bootstrap
#
# All services share the `ecogrid-net` bridge and publish ports on localhost only.
#
# Host ports are parameterised because developer machines frequently already run
# native Redis/PostgreSQL on 6379/5432. Override them in `.env` — e.g.
# POSTGRES_HOST_PORT=15432 — without touching the service's internal port.

name: ecogrid-os

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  networks:
    - ecogrid-net

# Platform Core image: one build, five commands (migrate / consumer / api /
# plant-bridge / plant-consumer / optimizer).
x-platform-common: &platform-common
  image: ecogrid/platform-core:phase3
  build:
    context: .
    dockerfile: Dockerfile.platform
  restart: unless-stopped
  networks:
    - ecogrid-net
  environment: &platform-env
    # In-network hostnames — NOT the host-mapped ports in .env.
    ECOGRID_POSTGRES_DSN: "postgresql+asyncpg://${POSTGRES_USER:-ecogrid}:${POSTGRES_PASSWORD:-ecogrid_dev_password}@postgres:5432/${POSTGRES_DB:-ecogrid}"
    ECOGRID_REDIS_URL: "redis://redis:6379/0"
    ECOGRID_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    ECOGRID_KAFKA_TOPIC: "${KAFKA_TELEMETRY_TOPIC:-ecogrid.telemetry.carbon}"
    ECOGRID_KAFKA_CONSUMER_GROUP: "${KAFKA_CONSUMER_GROUP:-ecogrid-platform-core}"
    ECOGRID_LOG_LEVEL: "INFO"
    ECOGRID_RATE_LIMIT_REQUESTS: "${API_RATE_LIMIT_REQUESTS:-120}"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — durable system state, RBAC, and the immutable audit ledger
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ecogrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecogrid}
      POSTGRES_USER: ${POSTGRES_USER:-ecogrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecogrid_dev_password}
      # Deterministic collation keeps index ordering stable across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecogrid-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecogrid} -d ${POSTGRES_DB:-ecogrid}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "log_min_duration_statement=500"

  # ---------------------------------------------------------------------------
  # Redis 7 — session cache, rate-limit counters, hot telemetry read cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ecogrid-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecogrid-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Apache Kafka — KRaft mode (no ZooKeeper). Combined broker + controller node.
  #   In-network clients  : kafka:29092
  #   Host machine clients: localhost:9092
  # ---------------------------------------------------------------------------
  kafka:
    <<: *kafka-common
    hostname: kafka
    container_name: ecogrid-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # --- KRaft identity / quorum ---
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # --- Listeners ---
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      # NOTE: the host listener's port must match the published port below,
      # otherwise clients receive unreachable broker metadata on first fetch.
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # --- Single-node replication (scale these out with the broker count) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # Topics are provisioned explicitly by `kafka-init`; never auto-created.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      # --- Throughput / latency tuning ---
      KAFKA_NUM_NETWORK_THREADS: 4
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 10000
      KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: 6000
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # Probe the INTERNAL listener (kafka:29092), not localhost:29092 — the
      # PLAINTEXT listener is bound to the `kafka` hostname, so inside the
      # container localhost:29092 refuses connections while kafka:29092 answers.
      test:
        - "CMD-SHELL"
        - "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1 || exit 1"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  # ---------------------------------------------------------------------------
  # One-shot topic provisioner — idempotent, runs after the broker is healthy.
  # `cleanup.policy=compact,delete` keeps the latest state per window key while
  # still ageing out cold history.
  # ---------------------------------------------------------------------------
  kafka-init:
    <<: *kafka-common
    container_name: ecogrid-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[kafka-init] provisioning topics..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic "${KAFKA_TELEMETRY_TOPIC:-ecogrid.telemetry.carbon}" \
          --partitions 3 --replication-factor 1 \
          --config cleanup.policy=compact,delete \
          --config retention.ms=604800000 \
          --config min.insync.replicas=1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic "${KAFKA_DLQ_TOPIC:-ecogrid.telemetry.carbon.dlq}" \
          --partitions 1 --replication-factor 1 \
          --config retention.ms=1209600000
        # --- Phase 3 topics -------------------------------------------------
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic "${KAFKA_PLANT_TOPIC:-ecogrid.telemetry.plant}" \
          --partitions 3 --replication-factor 1 \
          --config cleanup.policy=compact,delete \
          --config retention.ms=604800000
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic "${KAFKA_PLANT_DLQ_TOPIC:-ecogrid.telemetry.plant.dlq}" \
          --partitions 1 --replication-factor 1 \
          --config retention.ms=1209600000
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic "${KAFKA_DECISIONS_TOPIC:-ecogrid.decisions.schedule}" \
          --partitions 1 --replication-factor 1 \
          --config cleanup.policy=compact,delete \
          --config retention.ms=604800000
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic "${KAFKA_ADVICE_TOPIC:-ecogrid.decisions.advice}" \
          --partitions 1 --replication-factor 1 \
          --config retention.ms=604800000
        kafka-topics --bootstrap-server kafka:29092 --describe \
          --topic "${KAFKA_TELEMETRY_TOPIC:-ecogrid.telemetry.carbon}"
        echo "[kafka-init] done."

  # ---------------------------------------------------------------------------
  # Grid ingestion worker (opt-in: --profile worker). Polls the UK Carbon
  # Intensity API every 300s and streams merged telemetry into Kafka.
  # ---------------------------------------------------------------------------
  ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecogrid/grid-ingestor:phase1
    container_name: ecogrid-ingestor
    profiles: ["worker"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ECOGRID_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      ECOGRID_KAFKA_TOPIC: "${KAFKA_TELEMETRY_TOPIC:-ecogrid.telemetry.carbon}"
      ECOGRID_POLL_INTERVAL_SECONDS: "300"
      ECOGRID_LOG_LEVEL: "INFO"
      ECOGRID_SPOOL_PATH: "/app/data/spool/telemetry-spool.jsonl"
      ECOGRID_HEARTBEAT_PATH: "/app/data/heartbeat"
      ECOGRID_REDIS_URL: "redis://redis:6379/0"
      ECOGRID_POSTGRES_DSN: "postgresql://${POSTGRES_USER:-ecogrid}:${POSTGRES_PASSWORD:-ecogrid_dev_password}@postgres:5432/${POSTGRES_DB:-ecogrid}"
    volumes:
      - ./data:/app/data
    networks:
      - ecogrid-net

  # ---------------------------------------------------------------------------
  # Phase 2 — schema bootstrap. One-shot and idempotent; the consumer and API
  # both gate on `service_completed_successfully` so tables always exist first.
  # ---------------------------------------------------------------------------
  migrate:
    <<: *platform-common
    container_name: ecogrid-migrate
    # `migrate` is depended on by services in THREE profiles — platform
    # (consumer/api), phase3 (plant-bridge/plant-consumer/optimizer) and ai
    # (orchestrator). A service may declare several profiles and is enabled when
    # ANY of them is active, which is exactly what is needed here.
    #
    # With `profiles: ["platform"]` alone, `docker compose --profile phase3
    # logs plant-bridge` failed with "no such service: migrate": naming a
    # service activates its own profile, but its dependencies must also be in an
    # active profile. Listing all three fixes that.
    profiles: ["platform", "phase3", "ai", "gateway"]
    restart: "no"
    # One-shot schema bootstrap. MUST run `ecogrid.migrate`, NOT the image's
    # default CMD (which is the consumer) — otherwise this container would start
    # the consumer and never exit, blocking consumer/api which wait on
    # `service_completed_successfully`.
    command: ["python", "-m", "ecogrid.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *platform-env
      # Optional fixed bootstrap key. If unset, `migrate` generates one and
      # prints it exactly once.
      ECOGRID_BOOTSTRAP_ADMIN_KEY: "${ECOGRID_BOOTSTRAP_ADMIN_KEY:-}"

  # ---------------------------------------------------------------------------
  # Phase 2 — telemetry consumer. Kafka → PostgreSQL (idempotent upsert on
  # window_from) → Redis hot cache. Offsets are committed only after the
  # database accepts the write.
  # ---------------------------------------------------------------------------
  consumer:
    <<: *platform-common
    container_name: ecogrid-consumer
    profiles: ["platform"]
    command: ["python", "-m", "ecogrid.consumer"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The consumer has no HTTP surface; liveness is proven by a live process
      # plus a responsive database, which is what actually stalls in practice.
      test: ["CMD-SHELL", "pgrep -f 'ecogrid.consumer' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Phase 2 — read API. Authenticated, RBAC-enforced, rate limited, audited.
  # ---------------------------------------------------------------------------
  api:
    <<: *platform-common
    container_name: ecogrid-api
    # `gateway` is listed because the gateway depends on this service: enabling
    # only the gateway profile must still pull the API in, or the command dies
    # with "no such service: api". See the profile-integrity test.
    profiles: ["platform", "gateway"]
    command:
      - "uvicorn"
      - "ecogrid.api:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--no-access-log"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Phase 3 — AS400 / legacy plant-operations bridge. Polls plant load and
  # publishes to ecogrid.telemetry.plant. Swap ECOGRID_PLANT_SOURCE to `file` or
  # `odbc` to read real AS400 exports / a live DSN.
  # ---------------------------------------------------------------------------
  plant-bridge:
    <<: *platform-common
    container_name: ecogrid-plant-bridge
    profiles: ["phase3"]
    command: ["python", "-m", "ecogrid.plant.bridge"]
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *platform-env
      ECOGRID_PLANT_SOURCE: "${ECOGRID_PLANT_SOURCE:-simulated}"
      ECOGRID_PLANT_IDS: "${ECOGRID_PLANT_IDS:-plant-01}"
      ECOGRID_PLANT_BASE_LOAD_MW: "${ECOGRID_PLANT_BASE_LOAD_MW:-40}"
      ECOGRID_PLANT_FLEXIBLE_FRACTION: "${ECOGRID_PLANT_FLEXIBLE_FRACTION:-0.35}"
      ECOGRID_PLANT_POLL_INTERVAL_SECONDS: "${ECOGRID_PLANT_POLL_INTERVAL_SECONDS:-300}"
      ECOGRID_PLANT_SPOOL_PATH: "/app/data/spool/plant-spool.jsonl"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'ecogrid.plant.bridge' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Phase 3 — plant telemetry consumer. ecogrid.telemetry.plant → PostgreSQL,
  # idempotent upsert on (plant_id, window_from).
  # ---------------------------------------------------------------------------
  plant-consumer:
    <<: *platform-common
    container_name: ecogrid-plant-consumer
    profiles: ["phase3"]
    command: ["python", "-m", "ecogrid.plant.consumer"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'ecogrid.plant.consumer' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Phase 3 — Databricks optimization loop. Carbon forecast + plant flexibility
  # → dispatch schedule → ecogrid.decisions.schedule.
  # ---------------------------------------------------------------------------
  optimizer:
    <<: *platform-common
    container_name: ecogrid-optimizer
    profiles: ["phase3"]
    command: ["python", "-m", "ecogrid.optimizer.loop"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *platform-env
      ECOGRID_OPTIMIZER_HORIZON_WINDOWS: "${ECOGRID_OPTIMIZER_HORIZON_WINDOWS:-24}"
      ECOGRID_OPTIMIZER_INTERVAL_SECONDS: "${ECOGRID_OPTIMIZER_INTERVAL_SECONDS:-900}"
      # Databricks production path — leave unset to use the local solver.
      ECOGRID_DATABRICKS_HOST: "${ECOGRID_DATABRICKS_HOST:-}"
      ECOGRID_DATABRICKS_TOKEN: "${ECOGRID_DATABRICKS_TOKEN:-}"
      ECOGRID_DATABRICKS_JOB_ID: "${ECOGRID_DATABRICKS_JOB_ID:-}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'ecogrid.optimizer.loop' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # AI Orchestrator — Claude-backed judgement over the optimizer's output.
  # Runs without an API key too: it falls back to the deterministic heuristic
  # advisor, so advice never goes silent. Opt-in profile `ai`.
  # ---------------------------------------------------------------------------
  orchestrator:
    <<: *platform-common
    container_name: ecogrid-orchestrator
    profiles: ["ai"]
    command: ["python", "-m", "ecogrid.orchestrator.loop"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *platform-env
      ECOGRID_ORCHESTRATOR_ENABLED: "${ECOGRID_ORCHESTRATOR_ENABLED:-true}"
      ECOGRID_ORCHESTRATOR_INTERVAL_SECONDS: "${ECOGRID_ORCHESTRATOR_INTERVAL_SECONDS:-1800}"
      # Optional. Without a key the heuristic advisor is used instead.
      ECOGRID_ANTHROPIC_API_KEY: "${ECOGRID_ANTHROPIC_API_KEY:-}"
      ECOGRID_ANTHROPIC_MODEL: "${ECOGRID_ANTHROPIC_MODEL:-claude-sonnet-4-20250514}"
      # Optional. Without a URI, runs are logged to a local JSONL file.
      ECOGRID_MLFLOW_TRACKING_URI: "${ECOGRID_MLFLOW_TRACKING_URI:-}"
      ECOGRID_ORCHESTRATOR_TRACKING_PATH: "/app/data/orchestrator-runs.jsonl"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'ecogrid.orchestrator.loop' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # TLS material for the gateway. Generates a SELF-SIGNED certificate suitable
  # for local development. For anything real, drop your own server.crt /
  # server.key into ./certs — this service will not overwrite existing files.
  # ---------------------------------------------------------------------------
  certs-init:
    image: alpine:3.19
    container_name: ecogrid-certs-init
    profiles: ["gateway"]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /certs
        if [ ! -f /certs/server.key ]; then
          echo "[certs-init] generating a self-signed certificate for local TLS..."
          apk add --no-cache openssl >/dev/null 2>&1
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /certs/server.key -out /certs/server.crt \
            -days 365 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" >/dev/null 2>&1
          echo "[certs-init] wrote /certs/server.crt (self-signed, dev only)"
        else
          echo "[certs-init] existing certificate present — leaving it untouched"
        fi
    volumes:
      - ./certs:/certs
    networks:
      - ecogrid-net

  # ---------------------------------------------------------------------------
  # Edge gateway: TLS termination, static dashboard, coarse per-IP rate limit,
  # reverse proxy to the API. This is the *external* entrypoint (TLS on 8443).
  # The API stays published on 127.0.0.1:8000 for direct local use — remove that
  # port mapping on the `api` service if you want the gateway to be the only way
  # in. (Both work; they are simply two doors to the same service.)
  #
  # Requires the dashboard to be built first: (cd dashboard && npm ci && npm run build)
  # ---------------------------------------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    container_name: ecogrid-gateway
    profiles: ["gateway"]
    restart: unless-stopped
    depends_on:
      certs-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${GATEWAY_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./dashboard/dist:/usr/share/nginx/html:ro
    networks:
      - ecogrid-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  ecogrid-net:
    name: ecogrid-net
    driver: bridge

volumes:
  postgres_data:
    name: ecogrid-postgres-data
  redis_data:
    name: ecogrid-redis-data
  kafka_data:
    name: ecogrid-kafka-data
